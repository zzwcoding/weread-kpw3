# KOReader 开机自启 job（KPW3，固件 5.16.2.1.1，upstart 0.6.6）
#
# 安装：mntroot rw 后拷到 /etc/upstart/koreader.conf
# 生效条件（双保险，均可从 USB 盘直接删除来回退）：
#   1. /mnt/us/AUTOSTART_KOREADER 存在才自启
#   2. /mnt/us/koreader/koreader.sh 存在（即已安装 KOReader）
#
# hook 在 started lab126_gui：此刻 X/触屏/powerd/wifid/用户分区全部就绪，
# 而 Java framework（被 DONT_START_FRAMEWORK 拦下）和 KPP 全家桶（被
# minimalize.sh 禁用）尚未消耗内存，是内存最干净的时机。
#
# 兼容性说明：本固件为 upstart 0.6.6，只使用该版本已有官方用例的 stanza
# （start on / stop on / respawn / pre-start script / script）。不要用
# kill timeout（1.5+ 才有，0.6.x 会因未知 stanza 拒绝解析整个 job）。
# 开关检查放在 pre-start，与 framework.conf 的官方做法一致
# （"check here so we don't engage respawning"）。

start on started lab126_gui
stop on stopping lab126_gui or ota-update

respawn

pre-start script
    source /etc/upstart/env

    # 开关文件不存在则不自启（插电脑删掉它即可回到原生系统）
    if [ ! -f /mnt/us/AUTOSTART_KOREADER ]; then
        stop
        exit 0
    fi

    # KOReader 未安装则退出
    if [ ! -f /mnt/us/koreader/koreader.sh ]; then
        stop
        exit 0
    fi

    # 快速崩溃保护：60 秒内第 3 次被拉起时放弃（避免 respawn 死循环）
    LAST=/var/local/koreader_last_start
    COUNT=/var/local/koreader_start_count
    now=$(date +%s)
    last=$(cat $LAST 2>/dev/null || echo 0)
    count=$(cat $COUNT 2>/dev/null || echo 0)
    if [ $((now - last)) -lt 60 ]; then
        count=$((count + 1))
    else
        count=0
    fi
    echo $now > $LAST
    echo $count > $COUNT
    if [ $count -ge 3 ]; then
        stop
        exit 0
    fi
end script

script
    source /etc/upstart/env
    # /mnt/us 是 noexec，用 sh 解释执行入口（与 KUAL 的做法一致）
    exec sh /mnt/us/koreader/koreader.sh 2>>/tmp/koreader.err
end script
